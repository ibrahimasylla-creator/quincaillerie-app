 services:
  # 1. API GATEWAY
  - type: web
    name: quincaillerie-api-gateway
    env: python
    plan: free
    buildCommand: cd api-gateway && pip install -r requirements.txt
    startCommand: cd api-gateway && gunicorn gateway.wsgi:application --workers 2 --threads 4 --timeout 120
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SHARED_SECRET
        generateValue: true
      - key: AUTH_SERVICE_URL
        value: https://quincaillerie-auth-service.onrender.com
      - key: PRODUITS_SERVICE_URL
        value: https://quincaillerie-produits-service.onrender.com
      - key: STOCK_SERVICE_URL
        value: https://quincaillerie-stock-service.onrender.com
      - key: ACHATS_SERVICE_URL
        value: https://quincaillerie-achats-service.onrender.com
      - key: VENTES_SERVICE_URL
        value: https://quincaillerie-ventes-service.onrender.com
      - key: CLIENT_SERVICE_URL
        value: https://quincaillerie-client-service.onrender.com

  # 2. AUTH SERVICE
  - type: web
    name: quincaillerie-auth-service
    env: python
    plan: free
    buildCommand: cd services/auth-service && pip install -r requirements.txt && python manage.py migrate --noinput || true
    startCommand: cd services/auth-service && gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        value: mysql://undjjgwejthprrpb:qcmxL8tSlAHwoobcbXI2@btsw3hw4vvumigsjq7nz-mysql.services.clever-cloud.com:3306/btsw3hw4vvumigsjq7nz
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true

